version: '3.8'

services:
  api:
    build: .
    container_name: topgun_api
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - ADMIN_API_KEY=topgun_admin_super_secret_key
      - DATABASE_URL=postgresql+asyncpg://postgres:topgun_pass@db:5432/topgun_db
      - DEFAULT_TEST_QUOTA=5
      - DEFAULT_GLOBAL_MODE=all
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  db:
    image: postgres:15-alpine
    container_name: topgun_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=topgun_pass
      - POSTGRES_DB=topgun_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d topgun_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
